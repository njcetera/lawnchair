// AresLauncher's out-of-process instrumentation module.
//
// `com.android.test`, exactly like `:baseline-profile` -- a self-contained test APK that installs
// alongside the launcher and drives it from its own process. Nothing here is compiled into the
// shipped app.
//
// Deliberately NOT an `androidTest` source set on the app module: that would run in the launcher's
// own process, where the test classpath and the launcher's would have to agree, and where a test
// could reach into view state directly instead of through the seam the tests are meant to exercise.
plugins {
    alias(libs.plugins.android.test)
}

android {
    namespace 'app.lawnchair.arestests'

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    targetProjectPath = ":"

    // OUT-OF-PROCESS, and this line is the whole of it.
    //
    // Without it AGP points the instrumentation at the app: `am instrument` then FORCE-STOPS the
    // launcher and re-launches it as an instrumented process with the test classes inside it.
    // Measured here: `pm list instrumentation` read `(target=app.lawnchair.debug)`, and enabling
    // the test provider -- which restarts the launcher -- killed the test with it.
    //
    // Self-instrumenting makes the test its own target, so the launcher runs as the real home app,
    // in its own process, with its own lifecycle, and the test drives it from outside. Same switch
    // macrobenchmark uses, and the reason `:baseline-profile` does not hit this.
    experimentalProperties["android.experimental.self-instrumenting"] = true

    // Must mirror the app's dimensions or AGP cannot resolve which app variant to test against.
    flavorDimensions += ["app", "recents", "channel"]
    productFlavors {
        lawn { dimension = "app" }
        withQuickstep { dimension = "recents" }
        github { dimension = "channel" }
        nightly { dimension = "channel" }
        play { dimension = "channel" }
    }

    // A NON-FOLDABLE device, which is the whole point.
    //
    // Every instrumented run this project has ever done was on `AresFold`, and that AVD cannot be
    // talked out of being a foldable: `mIsFoldable` is
    // `hasSystemFeature(FEATURE_SENSOR_HINGE_ANGLE)` (`DisplayController.java:589`), a
    // PackageManager feature, so `wm size` resizes the window and changes nothing about the flag.
    // `isTwoPanels = isTablet && isMultiDisplay` (`DeviceProperties.kt:73`) is therefore
    // permanently true at tablet size on it -- the "tablet" rows of the 2026-09-02 form-factor
    // sweep were a foldable in a costume, and the sweep says so.
    //
    // Twelve behaviours hang off `isTwoPanels` in `Workspace.java` alone and their single-panel
    // branch has never executed under test. This device runs it. Expect findings; that is the
    // point, and the owner's stated worry ("the goal is for this to be installed on any newer
    // android device") is exactly this gap.
    //
    // Deliberately NOT wired into `check` -- it boots an AVD and downloads a system image, so it
    // stays an explicit task (`:ares-tests:pixel7Api36DebugAndroidTest`). A slow job silently
    // attached to the default build is how a gate gets switched off for good.
    testOptions.managedDevices.localDevices {
        create("pixel7Api36") {
            device = "Pixel 7"
            apiLevel = 36
            systemImageSource = "google"
        }
    }
}

dependencies {
    implementation libs.androidx.junit
    implementation libs.androidx.uiautomator
    implementation libs.androidx.test.runner
    implementation libs.androidx.test.rules
    implementation libs.google.truth
    // ViewCapture anomaly detectors (restored from f3112aea02) analyse ExportedData/FrameData/ViewNode
    // protos, which viewcapturelib generates under Gradle -- verified, not assumed:
    // viewcapturelib/build/generated/java/generateDebugProto/.../ExportedData.java exists.
    implementation project(":viewcapturelib")
    // The proto RUNTIME does not leak transitively -- viewcapturelib declares javalite as
    // `implementation`, so ExportedData resolves here but its GeneratedMessageLite superclass does
    // not. Declared directly rather than widened to `api` over there, which would change that
    // module for every consumer.
    implementation libs.protobuf.javalite
}
